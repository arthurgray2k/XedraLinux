# ==============================================================================
# Xedra Linux - Build Configuration Manifest (Xedra 0.2)
#
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Purpose:
#   Central declarative configuration manifest for Xedra Linux builds.
#   Controls versioning, caching policy, upstream mirrors, and live session setup.
# ==============================================================================

# --- 1. Distribution Identity & Versioning ---
DISTRO_NAME="Xedra Linux"
DISTRO_VERSION="0.2"
DISTRO_CODENAME="genesis"
ISO_VOLUME="XEDRA_0_2"
ISO_APPLICATION="Xedra Linux 0.2"
ISO_PUBLISHER="Xedra Linux Project"

# --- 2. Build Profile & Caching Policies ---
# Supported Profiles:
#   - "dev":     Fast iterative builds (persistent package cache enabled, no purge)
#   - "release": Pristine production build (purges previous cache, re-downloads all packages)
BUILD_PROFILE="dev"

# Cache Settings (Overridden dynamically if --profile is passed to build script)
CACHE_PACKAGES=true
PURGE_ON_CLEAN=false

# --- 3. Upstream Debian Base ---
DEBIAN_DISTRIBUTION="trixie"
DEBIAN_ARCH="amd64"
DEBIAN_ARCHIVE_AREAS="main contrib non-free non-free-firmware"
DEBIAN_MIRROR_BOOTSTRAP="https://deb.debian.org/debian"
DEBIAN_MIRROR_BINARY="https://deb.debian.org/debian"

# --- 4. Live Session & User Configuration ---
LIVE_HOSTNAME="xedra"
LIVE_USERNAME="xedra"
LIVE_USER_GROUPS="sudo,audio,video,cdrom,plugdev,kvm,input,tty"
LIVE_AUTOLOGIN=true
